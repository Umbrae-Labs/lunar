packages:
  - '.'

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Explicitly adopted Rito release with precompiled native libraries.
  - '@umbrae-labs/rito-rn@0.2.2'
  # Expo SDK patch packages must remain in the same release set.
  - '@expo/*'
  - expo
  - expo-*
  - babel-preset-expo

allowBuilds:
  '@shopify/react-native-skia': true
  esbuild: true
  unrs-resolver: true

patchedDependencies:
  '@shopify/react-native-skia@2.6.2': patches/@shopify__react-native-skia@2.6.2.patch
  # Str's worklet context must not capture the non-serializable Logger singleton.
  expensify-common@2.0.207: patches/expensify-common@2.0.207.patch
  'html-entities@2.5.3': patches/html-entities@2.5.3.patch

overrides:
  # Markdown consumers share the app's React; Expensify pins legacy web dependencies.
  'expensify-common@2.0.207>react': 19.2.3
  'expensify-common@2.0.207>react-dom': 19.2.3
  # Preserve Expensify's exact fork without permitting arbitrary Git subdependencies.
  'expensify-common@2.0.207>simply-deferred': file:vendor/simply-deferred-77a08a9.tgz

# standard-navigation imports React without declaring it as a runtime dependency.
packageExtensions:
  'standard-navigation@0.0.5':
    dependencies:
      react: 19.2.3
