name: Publish Lunar market
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-market
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Sign the reviewed index
        env:
          MIRROR: ${{ vars.LUNAR_GITHUB_RELEASE_MIRROR }}
          INDEX_URL: ${{ vars.LUNAR_MARKET_INDEX_URL }}
          SIGNING_KEY: ${{ secrets.LUNAR_MARKET_SIGNING_KEY }}
        run: |
          set -eu
          shopt -s nullglob
          umask 077
          key="$RUNNER_TEMP/market.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          umask 022
          options=(--config-out site/config.json --index-url "${INDEX_URL:-index.json}")
          if [[ -n "$MIRROR" ]]; then options+=(--mirror "$MIRROR"); fi
          npx --no-install lunar-plugin market-index plugins/*.json --key "$key" --out site/index.json "${options[@]}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
