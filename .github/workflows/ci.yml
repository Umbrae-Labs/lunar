name: CI

on:
  push:
    branches: ['**']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'plugins/**'
      - 'patches/**'
      - 'vendor/**'
      - '.github/**'
      - '.cnb.yml'
      - 'scripts/**'
      - 'changelog/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.easignore'
  pull_request:
    branches: ['main']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'plugins/**'
      - 'patches/**'
      - 'vendor/**'
      - '.github/**'
      - '.cnb.yml'
      - 'scripts/**'
      - 'changelog/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.easignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check application
        run: pnpm run check
      - name: Check dependencies against the installed Expo SDK
        env:
          EXPO_OFFLINE: '1'
        run: pnpm run check:expo
