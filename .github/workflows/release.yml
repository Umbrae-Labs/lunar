name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.3.0 or 0.3.0-rc.1 (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v${{ inputs.version }}
  LUNAR_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version, changelog and destination
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release.mjs preflight "$RELEASE_TAG"
      - uses: ./.github/actions/build-android
        with:
          profile: release
          cnb-token: ${{ secrets.CNB_SECRET }}
          release-tag: ${{ env.RELEASE_TAG }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: release-android-${{ github.run_id }}
          path: artifacts/
      - name: Publish verified assets, bilingual notes and full changelog link
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish "$RELEASE_TAG"
